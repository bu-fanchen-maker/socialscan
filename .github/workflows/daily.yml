name: weekly-scan
on:
  schedule:
    - cron: "0 21 * * 0"   # Sunday 21:00 UTC = Monday 06:00 JST
  workflow_dispatch:
    inputs:
      harvest:
        description: "Run the harvester (false = just deploy the committed site/)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'schedule' || inputs.harvest }}
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: ${{ github.event_name == 'schedule' || inputs.harvest }}
      - run: python -m playwright install --with-deps chromium
        if: ${{ github.event_name == 'schedule' || inputs.harvest }}
      - name: Harvest and build site
        if: ${{ github.event_name == 'schedule' || inputs.harvest }}
        run: python -m scan.run --no-x
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
      - name: Commit harvested data back to main
        if: ${{ github.event_name == 'schedule' || inputs.harvest }}
        run: |
          git config user.name "social-scan bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
